name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Allocate Massive Swap Space (16GB Enterprise RAM Boost)
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Install System Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          curl \
          wget \
          zip \
          unzip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libreadline-dev \
          libffi-dev \
          libssl-dev \
          libsqlite3-dev \
          sqlite3 \
          bzip2 \
          libbz2-dev \
          liblzma-dev \
          tk-dev \
          libltdl-dev \
          cmake \
          ccache \
          libc6:i386 \
          libstdc++6:i386 \
          zlib1g:i386

    - name: Install Python Build Tools
      run: |
        python -m pip install --upgrade pip
        pip install "setuptools<=68.2.2" wheel cython==0.29.36 requests colorama urllib3 certifi
        pip install --upgrade buildozer

    - name: Create Clean buildozer.spec Safely
      run: |
        printf '%s\n' \
        "[app]" \
        "title = TradeMatrix" \
        "package.name = tradematrix" \
        "package.domain = org.tradematrix" \
        "source.dir = ." \
        "source.include_exts = py,png,jpg,kv,atlas,txt,json" \
        "version = 0.2" \
        "requirements = python3,kivy,kivymd,requests,colorama,urllib3,certifi" \
        "orientation = portrait" \
        "fullscreen = 0" \
        "android.permissions = INTERNET,ACCESS_NETWORK_STATE" \
        "android.api = 33" \
        "android.minapi = 21" \
        "android.ndk = 25b" \
        "android.accept_sdk_license = True" \
        "android.archs = arm64-v8a" \
        "p4a.branch = master" \
        "" \
        "[buildozer]" \
        "log_level = 2" \
        "warn_on_root = 1" > buildozer.spec

    - name: Build APK with Buildozer
      env:
        BUILDOZER_ALLOW_ROOT: "1"
        ACCEPT_BUILD_TOOLS_CHECKSUMS: "true"
        USE_CCACHE: "1"
      run: |
        buildozer -v android debug

    - name: Show Buildozer Log on Failure
      if: failure()
      run: |
        echo "=== FINDING BUILD LOGS ==="
        find . -name "*.log" -o -name "buildozer.spec"
        if [ -d ".buildozer" ]; then
          find .buildozer -name "*.log" -exec echo "--- {} ---" \; -exec cat {} \;
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TradeMatrix-APK
        path: bin/*.apk
