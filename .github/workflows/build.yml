name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Generate Clean buildozer.spec Automatically
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = TradeMatrix
        package.name = tradematrix
        package.domain = org.tradematrix
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,txt,json
        version = 0.2
        requirements = python3,kivy,kivymd,requests,colorama,urllib3,certifi
        orientation = portrait
        fullscreen = 0
        android.permissions = INTERNET,ACCESS_NETWORK_STATE
        android.api = 33
        android.minapi = 21
        android.ndk = 25b
        android.accept_sdk_license = True
        android.archs = arm64-v8a
        p4a.branch = master

        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: Build with Advanced Buildozer Action
      uses: ArtemSBulgakov/buildozer-action@v1
      with:
        buildozer_version: stable
        command: buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TradeMatrix-APK
        path: bin/*.apk
