name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Buildozer Global Directory & SDK
      uses: actions/cache@v4
      with:
        path: |
          .buildozer
          ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Allocate Massive Swap Space (16GB Enterprise RAM Boost)
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Install Advanced System Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          curl \
          wget \
          zip \
          unzip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libreadline-dev \
          libffi-dev \
          libssl-dev \
          libsqlite3-dev \
          sqlite3 \
          bzip2 \
          libbz2-dev \
          liblzma-dev \
          tk-dev \
          libltdl-dev \
          cmake \
          ccache \
          libc6:i386 \
          libstdc++6:i386 \
          zlib1g:i386

    - name: Install Python Build Tools
      run: |
        python -m pip install --upgrade pip
        pip install "setuptools<=68.2.2" wheel cython==0.29.36 requests colorama urllib3 certifi
        pip install --upgrade buildozer

    - name: Create Enterprise-Grade buildozer.spec
      run: |
        printf '%s\n' \
        "[app]" \
        "title = TradeMatrix" \
        "package.name = tradematrix" \
        "package.domain = org.tradematrix" \
        "source.dir = ." \
        "source.include_exts = py,png,jpg,kv,atlas,txt,json" \
        "version = 0.2" \
        "requirements = python3,kivy,kivymd,requests,colorama,urllib3,certifi" \
        "orientation = portrait" \
        "fullscreen = 0" \
        "android.permissions = INTERNET,ACCESS_NETWORK_STATE" \
        "android.api = 31" \
        "android.minapi = 21" \
        "android.ndk = 25b" \
        "android.accept_sdk_license = True" \
        "android.archs = arm64-v8a" \
        "p4a.branch = master" \
        "" \
        "[buildozer]" \
        "log_level = 2" \
        "warn_on_root = 1" > buildozer.spec

    - name: Pre-accept Android SDK Licenses
      run: |
        mkdir -p /home/runner/.android
        touch /home/runner/.android/repositories.cfg
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb139a648b0" >> /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" >> /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

    - name: Build APK with Bulletproof Error Prevention
      env:
        BUILDOZER_ALLOW_ROOT: "1"
        ACCEPT_BUILD_TOOLS_CHECKSUMS: "true"
        USE_CCACHE: "1"
      run: |
        buildozer -v android debug

    - name: Upload Enterprise APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TradeMatrix-APK
        path: bin/*.apk
